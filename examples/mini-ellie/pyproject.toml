[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-ellie"
version = "1.0.0"
description = "Teaching-sized Ellie agent harness"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mini-ellie = "mini_ellie.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.4.4",
]

[tool.setuptools.packages.find]
include = ["mini_ellie*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

