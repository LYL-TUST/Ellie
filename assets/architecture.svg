<svg viewBox="0 0 680 560" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Ellie 系统架构图</title>
  <desc>Ellie 终端 AI 编程助手的四层架构</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-sm" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 2L7 5L2 8" fill="none" stroke="context-stroke"
        stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="12" y="12" width="656" height="538" rx="14" fill="#FAFBFC" stroke="#D3D1C7" stroke-width="0.5"/>

  <text x="340" y="44" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#26215C">Ellie 系统架构</text>
  <text x="340" y="64" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#888780">终端 AI 编程助手  ·  纯标准库实现  ·  零外部依赖</text>

  <!-- Layer 1: 入口层 -->
  <rect x="36" y="80" width="616" height="82" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <rect x="36" y="80" width="4" height="82" rx="2" fill="#185FA5"/>
  <rect x="44" y="92" width="52" height="22" rx="5" fill="#185FA5"/>
  <text x="70" y="107" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#fff">入口层</text>

  <rect x="160" y="98" width="190" height="48" rx="8" fill="#fff" stroke="#185FA5" stroke-width="0.5"/>
  <text x="255" y="116" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#0C447C">命令行交互</text>
  <text x="255" y="136" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#378ADD">CLI  ·  REPL  ·  一次性任务</text>

  <rect x="380" y="98" width="190" height="48" rx="8" fill="#fff" stroke="#185FA5" stroke-width="0.5"/>
  <text x="475" y="116" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#0C447C">HTTP API 服务</text>
  <text x="475" y="136" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#378ADD">/ask  ·  /reset  ·  流式响应</text>

  <line x1="340" y1="162" x2="340" y2="184" stroke="#534AB7" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Layer 2: 引擎层 -->
  <rect x="36" y="188" width="616" height="102" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <rect x="36" y="188" width="4" height="102" rx="2" fill="#534AB7"/>
  <rect x="44" y="200" width="52" height="22" rx="5" fill="#534AB7"/>
  <text x="70" y="215" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#fff">引擎层</text>

  <rect x="116" y="210" width="165" height="62" rx="8" fill="#fff" stroke="#534AB7" stroke-width="0.5"/>
  <text x="198" y="232" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="500" fill="#3C3489">AgentLoop</text>
  <text x="198" y="254" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#534AB7">think → act → observe</text>

  <line x1="281" y1="241" x2="302" y2="241" stroke="#7F77DD" stroke-width="1" marker-end="url(#arrow-sm)"/>

  <rect x="306" y="210" width="165" height="62" rx="8" fill="#fff" stroke="#534AB7" stroke-width="0.5"/>
  <text x="388" y="232" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="500" fill="#3C3489">Ellie 核心</text>
  <text x="388" y="254" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#534AB7">解析  ·  执行  ·  追踪</text>

  <line x1="471" y1="241" x2="492" y2="241" stroke="#7F77DD" stroke-width="1" marker-end="url(#arrow-sm)"/>

  <rect x="496" y="210" width="140" height="62" rx="8" fill="#fff" stroke="#534AB7" stroke-width="0.5"/>
  <text x="566" y="232" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="500" fill="#3C3489">ContextManager</text>
  <text x="566" y="254" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#534AB7">预算  ·  缩减  ·  构建</text>

  <line x1="340" y1="290" x2="340" y2="304" stroke="#0F6E56" stroke-width="1.2"/>
  <line x1="180" y1="304" x2="500" y2="304" stroke="#0F6E56" stroke-width="1.2"/>
  <line x1="180" y1="304" x2="180" y2="316" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="500" y1="304" x2="500" y2="316" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Layer 3: 能力层 -->
  <rect x="36" y="320" width="616" height="118" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="36" y="320" width="4" height="118" rx="2" fill="#0F6E56"/>
  <rect x="44" y="332" width="52" height="22" rx="5" fill="#0F6E56"/>
  <text x="70" y="347" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#fff">能力层</text>

  <rect x="108" y="340" width="240" height="82" rx="8" fill="#fff" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="228" y="363" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#085041">工具系统</text>
  <text x="228" y="384" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#1D9E75">list_files  read_file  search  git_diff</text>
  <text x="228" y="402" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#1D9E75">write_file  patch_file  run_shell</text>

  <rect x="368" y="340" width="240" height="82" rx="8" fill="#fff" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="488" y="363" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#085041">模型后端</text>
  <text x="488" y="388" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#1D9E75">DeepSeek  ·  OpenAI  ·  Anthropic</text>
  <text x="488" y="406" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#1D9E75">Ollama  ·  vLLM</text>

  <line x1="228" y1="438" x2="228" y2="454" stroke="#993C1D" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="488" y1="438" x2="488" y2="454" stroke="#993C1D" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Layer 4: 基础层 -->
  <rect x="36" y="458" width="616" height="70" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <rect x="36" y="458" width="4" height="70" rx="2" fill="#993C1D"/>
  <rect x="44" y="468" width="52" height="22" rx="5" fill="#993C1D"/>
  <text x="70" y="483" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#fff">基础层</text>

  <rect x="108" y="464" width="120" height="52" rx="8" fill="#fff" stroke="#993C1D" stroke-width="0.5"/>
  <text x="168" y="485" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#712B13">分层记忆</text>
  <text x="168" y="503" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#D85A30">working + durable</text>

  <rect x="240" y="464" width="120" height="52" rx="8" fill="#fff" stroke="#993C1D" stroke-width="0.5"/>
  <text x="300" y="485" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#712B13">知识检索</text>
  <text x="300" y="503" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#D85A30">TF-IDF 语义搜索</text>

  <rect x="372" y="464" width="120" height="52" rx="8" fill="#fff" stroke="#993C1D" stroke-width="0.5"/>
  <text x="432" y="485" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#712B13">安全护栏</text>
  <text x="432" y="503" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#D85A30">审批  ·  沙箱  ·  脱敏</text>

  <rect x="504" y="464" width="120" height="52" rx="8" fill="#fff" stroke="#993C1D" stroke-width="0.5"/>
  <text x="564" y="485" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#712B13">持久存储</text>
  <text x="564" y="503" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#D85A30">session  ·  run  ·  trace</text>

  <text x="340" y="546" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#B4B2A9">~7,300 行源码  ·  135 个测试用例  ·  5 种模型后端  ·  10 个内置工具</text>
</svg>