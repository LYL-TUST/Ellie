[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ellie"
version = "1.0.0"
description = "Ellie: a personal terminal coding assistant"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ellie = "ellie.cli:main"

[project.optional-dependencies]
server = ["fastapi", "uvicorn"]

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.4.4",
]

[tool.setuptools.packages.find]
include = ["ellie*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
